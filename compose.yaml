name: aicloud
# Only aicloud applications. Existing local middleware remains outside this project.
x-app-env: &app-env
  MYSQL_HOST: host.docker.internal
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  REDIS_HOST: host.docker.internal
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DATABASE: ${REDIS_DATABASE:-12}
  NACOS_ADDR: host.docker.internal:8848
  IOT_RPC_URL: http://iot-server:48098
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
  AICLOUD_INTERNAL_SECRET: ${AICLOUD_INTERNAL_SECRET:?set AICLOUD_INTERNAL_SECRET in .env}
  SPRING_PROFILES_ACTIVE: local
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
services:
  ai-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        JAR_FILE: aicloud-module-ai/aicloud-module-ai-server/target/aicloud-module-ai-server.jar
    image: aicloud/ai-server:1.0.0
    profiles: ["ai", "full"]
    env_file: [".env"]
    environment:
      <<: *app-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: on-failure:3
    mem_limit: 1536m
    volumes: ["ai-data:/app/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:48090/actuator/health/readiness"]
      start_period: 120s
      interval: 20s
      timeout: 5s
      retries: 6
  bpm-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        JAR_FILE: aicloud-module-bpm/aicloud-module-bpm-server/target/aicloud-module-bpm-server.jar
